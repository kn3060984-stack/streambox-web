<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamBox TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #08080a; color: #ffffff; padding: 20px; text-align: center; }
    h1 { color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.4); margin-bottom: 5px; font-size: 26px; }
    p.subtitle { color: #888; font-size: 14px; margin-bottom: 20px; }
    
    /* प्लेयर स्क्रीन */
    .screen-container {
      max-width: 900px;
      margin: 0 auto 25px auto;
      background: #000;
      border: 2px solid #1a1a24;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    .video-frame {
      width: 100%;
      height: 480px;
      border: none;
      display: block;
      background: #000;
    }

    /* मूवी कार्ड्स ग्रिड */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: #12131a;
      border: 1px solid #232433;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card:hover, .card:focus {
      transform: translateY(-4px);
      border-color: #00ffcc;
      outline: none;
    }
    .card h3 { font-size: 15px; margin-bottom: 6px; color: #fff; }
    .badges { display: flex; justify-content: center; gap: 6px; }
    .badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1f2233;
      color: #00ffcc;
      border: 1px solid rgba(0,255,204,0.3);
    }
    .badge.red { color: #ff3366; border-color: rgba(255,51,102,0.3); }

    /* कस्टम यूआरएल बॉक्स */
    .custom-bar {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 10px;
      max-width: 700px;
      margin-inline: auto;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      background: #12131a;
      border: 1px solid #232433;
      border-radius: 6px;
      color: #fff;
      outline: none;
    }
    button {
      padding: 10px 20px;
      background: #00ffcc;
      color: #000;
      border: none;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>⚡ StreamBox TV Console</h1>
  <p class="subtitle">एंटी-पॉपअप और डायरेक्ट स्ट्रीम सपोर्ट</p>

  <div class="screen-container" id="playerContainer">
    <div style="height:480px; display:flex; align-items:center; justify-content:center; color:#555;">
      नीचे दी गई सूची में से टाइटल चुनें
    </div>
  </div>

  <div class="media-grid">
    <div class="card" tabindex="0" onclick="playSelected('hanuman')">
      <h3>हनुमान अंश</h3>
      <div class="badges">
        <span class="badge">1080p</span>
        <span class="badge red">Hindi/Multi</span>
      </div>
    </div>

    <div class="card" tabindex="0" onclick="playSelected('narsimha')">
      <h3>महा अवतार नरसिम्हा</h3>
      <div class="badges">
        <span class="badge">1080p</span>
        <span class="badge red">Hindi/Multi</span>
      </div>
    </div>

    <div class="card" tabindex="0" onclick="playSelected('jailer2')">
      <h3>जेलर 2</h3>
      <div class="badges">
        <span class="badge">1080p</span>
        <span class="badge red">Multi</span>
      </div>
    </div>

    <div class="card" tabindex="0" onclick="playSelected('alice')">
      <h3>Alice in Borderland</h3>
      <div class="badges">
        <span class="badge">1080p</span>
        <span class="badge">Dual Audio</span>
      </div>
    </div>

    <div class="card" tabindex="0" onclick="playSelected('wednesday')">
      <h3>Wednesday</h3>
      <div class="badges">
        <span class="badge">1080p</span>
        <span class="badge">Dual Audio</span>
      </div>
    </div>
  </div>

  <!-- कोई अन्य लिंक तुरंत चलाने के लिए -->
  <div class="custom-bar">
    <input type="text" id="manualUrl" placeholder="अन्य डायरेक्ट वीडियो / एम्बेड लिंक डालें...">
    <button onclick="playCustom()">चलाएं</button>
  </div>

  <script>
    // यहाँ अपने जुटाए गए डायरेक्ट वीडियो या एम्बेड लिंक्स पेस्ट करें:
    const mediaVault = {
      hanuman: "YOUR_HANUMAN_ANSH_LINK_HERE",
      narsimha: "YOUR_NARSIMHA_LINK_HERE",
      jailer2: "https://vidaraa.cc/e/VUML6lb02BNO",
      alice: "YOUR_ALICE_IN_BORDERLAND_LINK_HERE",
      wednesday: "YOUR_WEDNESDAY_LINK_HERE"
    };

    function renderPlayer(streamUrl) {
      const container = document.getElementById('playerContainer');

      // 1. अगर डायरेक्ट HLS (.m3u8) फाइल लिंक है:
      if (streamUrl.includes('.m3u8')) {
        container.innerHTML = '<video id="videoCore" class="video-frame" controls autoplay></video>';
        const video = document.getElementById('videoCore');
        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = streamUrl;
        }
      } 
      // 2. अगर डायरेक्ट MP4 फाइल लिंक है:
      else if (streamUrl.includes('.mp4') || streamUrl.includes('.mkv')) {
        container.innerHTML = `<video class="video-frame" controls autoplay src="${streamUrl}"></video>`;
      } 
      // 3. अगर किसी साइट का एम्बेड प्लेयर लिंक है (पॉपअप रोकने वाला सैंडबॉक्स):
      else {
        container.innerHTML = `
          <iframe 
            class="video-frame" 
            src="${streamUrl}" 
            sandbox="allow-scripts allow-same-origin allow-forms allow-presentation" 
            allow="autoplay; encrypted-media; fullscreen" 
            allowfullscreen>
          </iframe>`;
      }
    }

    function playSelected(key) {
      const url = mediaVault[key];
      if (!url || url.startsWith("YOUR_")) {
        alert("कृपया पहले कोड में इस टाइटल का लिंक जोड़ें।");
        return;
      }
      renderPlayer(url);
    }

    function playCustom() {
      const input = document.getElementById('manualUrl').value.trim();
      if (input) renderPlayer(input);
    }
  </script>
</body>
</html>
