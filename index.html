<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamBox - Multi-Language Movies & Anime</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e50914">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f1014; color: #fff; overflow-x: hidden; }
        
        header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 15px 30px; background: #16181f; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #2a2e3d; }
        .logo { font-size: 24px; font-weight: 900; color: #e50914; letter-spacing: 1px; cursor: pointer; }
        .search-box { display: flex; gap: 8px; flex: 1; max-width: 450px; margin: 10px 0; }
        input[type="text"] { flex: 1; padding: 10px 15px; border-radius: 6px; border: 1px solid #333; background: #222530; color: #fff; font-size: 15px; outline: none; }
        input[type="text"]:focus { border-color: #e50914; }
        .btn { padding: 10px 18px; background: #e50914; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; }
        .btn:hover, .btn:focus { background: #b80710; transform: scale(1.04); }

        .tabs { display: flex; gap: 12px; padding: 15px 30px; overflow-x: auto; background: #0f1014; white-space: nowrap; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: #222530; color: #bbb; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .tab-btn.active, .tab-btn:focus { background: #e50914; color: #fff; outline: none; }

        .container { padding: 10px 30px 40px; }
        .section-title { font-size: 20px; margin: 15px 0; color: #f1f1f1; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
        
        .card { background: #1c1f2b; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; position: relative; }
        .card:hover, .card:focus { transform: scale(1.05); outline: 3px solid #e50914; z-index: 5; }
        .card img { width: 100%; height: 230px; object-fit: cover; background: #2a2e3d; }
        .card-info { padding: 10px; }
        .card-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; margin-top: 5px; }
        .rating { color: #ffd700; font-weight: bold; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        .modal-content { width: 100%; max-width: 1000px; background: #16181f; border-radius: 10px; overflow: hidden; border: 1px solid #333; }
        .player-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #222530; }
        .server-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .server-btn { background: #333; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .server-btn.active, .server-btn:focus { background: #007bff; font-weight: bold; }
        .close-btn { background: transparent; border: none; color: white; font-size: 26px; cursor: pointer; }
        
        .iframe-container { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
        .iframe-container iframe { position: absolute; top:0; left: 0; width: 100%; height: 100%; border: 0; }
        
        .series-controls { display: none; padding: 10px 18px; background: #1c1f2b; gap: 15px; align-items: center; }
        .series-controls select { padding: 6px; background: #2a2e3d; color: white; border: 1px solid #444; border-radius: 4px; outline: none; }
        
        .player-actions { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #16181f; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="loadCategory('trending')">StreamBox</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="मूवी, एनिमे या वेब सीरीज खोजें..." onkeydown="if(event.key==='Enter') searchMovie()">
            <button class="btn" onclick="searchMovie()">Search</button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="loadCategory('trending', this)">🔥 Trending</button>
        <button class="tab-btn" onclick="loadCategory('movies', this)">🎬 Movies</button>
        <button class="tab-btn" onclick="loadCategory('anime', this)">⛩️ Anime (Safe)</button>
        <button class="tab-btn" onclick="loadCategory('kids', this)">🧸 Kids & Family</button>
        <button class="tab-btn" onclick="loadCategory('series', this)">📺 Web Series</button>
    </div>

    <div class="container">
        <h2 class="section-title" id="pageTitle">Trending Now</h2>
        <div class="movie-grid" id="movieGrid"></div>
    </div>

    <div class="modal" id="playerModal">
        <div class="modal-content">
            <div class="player-header">
                <div class="server-bar">
                    <span style="font-size: 13px; color: #aaa;">Servers (Check Multi-Audio in Player):</span>
                    <button class="server-btn active" onclick="switchServer(1, this)">Server 1 (VidLink - Multi)</button>
                    <button class="server-btn" onclick="switchServer(2, this)">Server 2 (AutoEmbed)</button>
                    <button class="server-btn" onclick="switchServer(3, this)">Server 3 (Smashy)</button>
                </div>
                <button class="close-btn" onclick="closePlayer()">&times;</button>
            </div>
            
            <div class="series-controls" id="seriesControls">
                <label>Season: <select id="seasonSelect" onchange="updateEpisode()"></select></label>
                <label>Episode: <select id="episodeSelect" onchange="updateEpisode()"></select></label>
            </div>

            <div class="iframe-container">
                <iframe id="videoPlayer" src="" allowfullscreen></iframe>
            </div>

            <div class="player-actions">
                <span id="playerTitle" style="font-size: 14px; font-weight: bold;">Title</span>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'c8b6b2184efea6e036e8b4e72323a6c2';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        let currentId = null;
        let currentType = 'movie';
        let currentServer = 1;
        let currentSeason = 1;
        let currentEpisode = 1;

        async function loadCategory(type, btnElement = null) {
            if(btnElement) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }
            
            let url = '';
            let titleText = '';

            // 1. Trending
            if(type === 'trending') {
                url = `${BASE_URL}/trending/all/day?api_key=${API_KEY}&language=en-US`;
                titleText = '🔥 Trending Now';
            }
            // 2. Movies
            else if(type === 'movies') {
                url = `${BASE_URL}/movie/popular?api_key=${API_KEY}`;
                titleText = '🎬 Popular Movies';
            }
            // 3. Anime (Safe) - सिर्फ जापानी एनिमेशन, 18+ एडल्ट कंटेंट स्ट्रिक्टली ब्लॉक (include_adult=false)
            else if(type === 'anime') {
                url = `${BASE_URL}/discover/tv?api_key=${API_KEY}&with_original_language=ja&with_genres=16&include_adult=false&sort_by=popularity.desc`;
                titleText = '⛩️ Top Anime (Family & Action)';
            }
            // 4. Kids - सिर्फ फैमिली (10751) और एनिमेशन (16)
            else if(type === 'kids') {
                url = `${BASE_URL}/discover/movie?api_key=${API_KEY}&with_genres=10751,16&include_adult=false&sort_by=popularity.desc`;
                titleText = '🧸 Kids & Family Movies';
            }
            // 5. Web Series
            else if(type === 'series') {
                url = `${BASE_URL}/tv/popular?api_key=${API_KEY}&include_adult=false`;
                titleText = '📺 Popular Web Series';
            }

            document.getElementById('pageTitle').innerText = titleText;
            const res = await fetch(url);
            const data = await res.json();
            renderCards(data.results);
        }

        async function searchMovie() {
            const query = document.getElementById('searchInput').value.trim();
            if(!query) return;
            // सर्च में भी include_adult=false लगाया गया है ताकि डर्टी कंटेंट न आए
            const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}&include_adult=false`);
            const data = await res.json();
            document.getElementById('pageTitle').innerText = `Search Results: "${query}"`;
            renderCards(data.results.filter(item => item.media_type !== 'person'));
        }

        function renderCards(items) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            items.forEach(item => {
                if(!item.poster_path) return;
                const title = item.title || item.name;
                const isTv = item.media_type === 'tv' || (!item.title && item.name);
                const releaseYear = (item.release_date || item.first_air_date || '----').split('-')[0];
                
                const card = document.createElement('div');
                card.className = 'card';
                card.tabIndex = 0;
                card.innerHTML = `
                    <img src="${IMG_URL + item.poster_path}" alt="${title}" loading="lazy">
                    <div class="card-info">
                        <div class="card-title">${title}</div>
                        <div class="card-meta">
                            <span>${releaseYear}</span>
                            <span class="rating">★ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'}</span>
                        </div>
                    </div>
                `;
                card.onclick = () => openPlayer(item.id, isTv ? 'tv' : 'movie', title);
                card.onkeydown = (e) => { if(e.key === 'Enter') openPlayer(item.id, isTv ? 'tv' : 'movie', title); };
                grid.appendChild(card);
            });
        }

        function openPlayer(id, type, title) {
            currentId = id;
            currentType = type;
            document.getElementById('playerTitle').innerText = title;
            document.getElementById('seriesControls').style.display = type === 'tv' ? 'flex' : 'none';

            if(type === 'tv') setupTvControls();
            
            // डिफ़ॉल्ट रूप से सर्वर 1 को एक्टिव करें
            switchServer(1, document.querySelector('.server-btn:nth-child(2)'));
            document.getElementById('playerModal').style.display = 'flex';
        }

        function setupTvControls() {
            const seasonSelect = document.getElementById('seasonSelect');
            const episodeSelect = document.getElementById('episodeSelect');
            seasonSelect.innerHTML = ''; episodeSelect.innerHTML = '';

            for(let s = 1; s <= 15; s++) seasonSelect.innerHTML += `<option value="${s}">Season ${s}</option>`;
            for(let e = 1; e <= 50; e++) episodeSelect.innerHTML += `<option value="${e}">Episode ${e}</option>`;
        }

        function updateEpisode() {
            currentSeason = document.getElementById('seasonSelect').value;
            currentEpisode = document.getElementById('episodeSelect').value;
            setPlayerSource();
        }

        function switchServer(serverNum, btn) {
            currentServer = serverNum;
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            setPlayerSource();
        }

        function setPlayerSource() {
            let streamUrl = '';
            
            // मल्टी-ऑडियो सर्वर्स (ये सर्वर्स ड्युअल ऑडियो सपोर्ट करते हैं अगर फिल्म के लिए हिंदी अवेलेबल हो)
            if (currentType === 'movie') {
                if(currentServer === 1) streamUrl = `https://vidlink.pro/movie/${currentId}`; // VidLink (Supports Multi-Audio & Multi-Subs)
                if(currentServer === 2) streamUrl = `https://player.autoembed.cc/embed/movie/${currentId}`; // AutoEmbed
                if(currentServer === 3) streamUrl = `https://embed.smashystream.com/playere.php?tmdb=${currentId}`; // SmashyStream
            } else {
                if(currentServer === 1) streamUrl = `https://vidlink.pro/tv/${currentId}/${currentSeason}/${currentEpisode}`;
                if(currentServer === 2) streamUrl = `https://player.autoembed.cc/embed/tv/${currentId}/${currentSeason}/${currentEpisode}`;
                if(currentServer === 3) streamUrl = `https://embed.smashystream.com/playere.php?tmdb=${currentId}&season=${currentSeason}&episode=${currentEpisode}`;
            }
            document.getElementById('videoPlayer').src = streamUrl;
        }

        function closePlayer() {
            document.getElementById('videoPlayer').src = '';
            document.getElementById('playerModal').style.display = 'none';
        }

        loadCategory('trending');
    </script>
</body>
</html>
